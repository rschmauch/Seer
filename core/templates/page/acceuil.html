{% extends 'base.html' %}

{% block title %}Page d'Accueil{% endblock %}

{% block content_title %}
    <h1>Bienvenue sur la page d'accueil</h1>
{% endblock %}

{% block content %}
    <div class="form-container">
        <form action="" method="POST">
            <div class="form-link">
                <input type="url" id="link" name="link" placeholder="https://example.com" required>
            </div>

            {% csrf_token %}
            
            <div class="form-group">
                <label for="convertion">
                    Convertion en texte
                    <input type="checkbox" id="convertion" name="convertion">
                </label>
            </div>

            <div class="form-group">
                <label for="language">Langue préférée
                    <select id="language" name="language" required>
                        <option value="fr">Français</option>
                        <option value="en">Anglais</option>
                </label>
                </select>
            </div>

            <div class="form-group">
                <label for="constraste">
                    Mise en constraste
                    <input type="checkbox" id="constraste" name="constraste">
                </label>
            </div>

                <button type="submit">Envoyer</button>
        </form>
    </div>
{% endblock %}
